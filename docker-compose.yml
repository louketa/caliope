services:
  app:
    build:
      context: .
      target: production
    image: caliope-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SERVER_NAME: ${SERVER_NAME:-${DOMAIN:?defina DOMAIN no .env}}
      APP_NAME: Caliope
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-https://${DOMAIN}}
      APP_LOCALE: pt_BR
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: caliope
      DB_USERNAME: caliope
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      SESSION_DRIVER: database
      SESSION_LIFETIME: 43200
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-${DOMAIN}}
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - app_storage:/app/storage/app

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: caliope
      POSTGRES_USER: caliope
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caliope -d caliope"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Roda a suíte de testes: docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

volumes:
  db_data:
  caddy_data:
  caddy_config:
  app_storage:
